[project]
name = "healthcare-intelligence-copilot"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.3",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.18",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pgvector>=0.3.6",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2.1.6",
    "statsmodels>=0.15.0",
    "streamlit>=1.66.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]
